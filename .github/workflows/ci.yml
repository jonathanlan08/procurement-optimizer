name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: procurement_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --locked
      - name: Lint (ruff)
        run: uv run ruff check .
      - name: Typecheck (mypy strict)
        run: uv run mypy
      - name: Migration cycle on empty database (up -> down -> up)
        env:
          PO_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/procurement_test
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head
      - name: Tests
        env:
          PO_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/procurement_test
        run: uv run pytest --cov=src/app --cov-report=term-missing

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: procurement_e2e
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # No paid providers anywhere: extraction/narrative/storage all default
      # to mock/template/filesystem (backend/src/app/core/config.py) and are
      # never overridden here.
      PO_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/procurement_e2e
      PO_ALLOWED_ORIGINS: '["http://localhost:5173"]'
      # A scripted browser firing many TanStack Query fetches per page trips
      # the general-purpose in-memory rate limiter (tuned for one interactive
      # dev session, not a test suite) — raised here, config only, same as
      # scripts/e2e_local.sh.
      PO_RATE_LIMIT_PER_MINUTE: "6000"
      PO_RATE_LIMIT_AUTH_PER_MINUTE: "300"
      BACKEND_PORT: "8010"
      E2E_BASE_URL: "http://localhost:5173"
    steps:
      - uses: actions/checkout@v4
      # Caches are deliberately DISABLED for this job. `backend` and `frontend`
      # run concurrently and own the uv/npm caches; when this job also tried to
      # save them, the post-job save raced them ("Unable to reserve cache …
      # another job may be creating this cache") and setup-uv's post step exited
      # 2, failing an e2e run whose every real step — including the whole
      # Playwright suite — had already passed.
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --locked
      - name: Migrate database to head
        working-directory: backend
        run: uv run alembic upgrade head
      - name: Seed the synthetic demo dataset
        working-directory: backend
        run: uv run python scripts/seed_demo.py
      - name: Start backend and wait for health
        working-directory: backend
        run: |
          uv run uvicorn app.main:create_app --factory --port "$BACKEND_PORT" > /tmp/e2e-backend.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS "http://localhost:$BACKEND_PORT/api/health" >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          echo "backend did not become healthy in time" >&2
          cat /tmp/e2e-backend.log >&2
          exit 1
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Playwright's browsers (chromium, firefox, webkit + OS deps)
        working-directory: frontend
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Start frontend dev server and wait for it
        working-directory: frontend
        run: |
          npm run dev -- --port 5173 --strictPort > /tmp/e2e-frontend.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS "$E2E_BASE_URL/" >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          echo "frontend did not become ready in time" >&2
          cat /tmp/e2e-frontend.log >&2
          exit 1
      - name: Run Playwright E2E suite
        working-directory: frontend
        run: npx playwright test
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
