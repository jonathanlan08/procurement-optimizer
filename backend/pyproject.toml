[project]
name = "procurement-optimizer-backend"
version = "0.1.0"
description = "Backend for the Vendor Negotiation and Procurement Optimizer"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0.35",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "argon2-cffi>=23.1",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "openpyxl>=3.1",
    "pdfplumber>=0.11",
    "pypdf>=5.0",
    "pypdfium2>=4.30",
    "reportlab>=4.2",
    "ortools>=9.10",
    "rapidfuzz>=3.9",
    "email-validator>=2.3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.11",
    "pgserver>=0.1.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.uv]
package = true

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF", "TID"]
ignore = ["SIM108"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"app.domain.float".msg = "floats are banned in domain code; use Decimal"

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "integration: requires a database",
]

[tool.coverage.run]
source = ["src/app"]
