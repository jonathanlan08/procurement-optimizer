# Local development services for the Procurement Optimizer.
#
# The backend (FastAPI) and frontend run on the host, NOT in this compose file -
# see docs/planning/01-architecture.md §11 and docs/planning/08-test-strategy.md §4.
# This file exists to give developers who don't use `pgserver` a real Postgres and
# an S3-compatible MinIO without installing either natively.
#
# Usage:
#   docker compose up -d
#   docker compose down            # stop, keep data
#   docker compose down -v         # stop and wipe volumes (fresh DB/bucket)

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: procurement
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d procurement"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console
    volumes:
      - minio-data:/data
    healthcheck:
      # `curl` was removed from the minio/minio image; `mc` (bundled) is the
      # supported healthcheck method. See minio/minio#18389.
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  minio-data:
